{% extends 'base.html' %}{% block content %}<form class="search" method="get"><input name="q" value="{{ query }}" placeholder="Search your meals..."><button class="btn primary">Search</button></form><div class="section-head"><h3>Meal history</h3><span>{{ meals|length }} record(s)</span></div><div class="panel">{% if meals %}<table><thead><tr><th>Date</th><th>Meal</th><th>Food</th><th>Calories</th><th></th></tr></thead><tbody>{% for m in meals %}<tr><td>{{ m.date }}</td><td><span class="pill">{{ m.meal_type }}</span></td><td>{{ m.food_item }}</td><td>{{ m.calories }} kcal</td><td><form method="post" action="{{ url_for('delete_meal', meal_id=m.meal_id) }}"><button class="delete">Delete</button></form></td></tr>{% endfor %}</tbody></table>{% else %}<div class="empty">No matching meals.</div>{% endif %}</div>{% endblock %}
