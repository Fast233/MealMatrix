{% extends 'base.html' %}{% block content %}<div class="form-card"><span>GOAL SETTING</span><h2>Calorie goal</h2><p class="muted">The original project stores a weekly goal and converts it into a daily target.</p><form method="post"><label>Weekly calorie goal<input name="weekly_goal" type="number" min="0" step="1"></label><button class="btn primary">Save goal</button></form>{% if target %}<div class="goal-result">Current daily target: <b>{{ '%.1f'|format(target) }} kcal</b></div>{% endif %}</div>{% endblock %}
