{% extends 'base.html' %}

{% block content %}

<div class="hero compact">
    <div>
        <span>QUICK LOG</span>
        <h2>Record what you ate.</h2>
        <p>Choose a food and serving size. MealMatrix calculates the nutrition automatically.</p>
    </div>
</div>

<div class="form-card">
    <form method="post">

        <label>
            Meal type
            <select name="meal_type">
                <option>Breakfast</option>
                <option>Lunch</option>
                <option>Dinner</option>
                <option>Snack</option>
            </select>
        </label>

        <label>
            Food
            <select name="food">
                {% for f in foods %}
                <option value="{{ f.name.lower() }}">
                    {{ f.name }} — {{ "%.0f"|format(f.calories) }} kcal
                </option>
                {% endfor %}
            </select>
        </label>

        <label>
            Quantity
            <input name="quantity" type="number" min="0.25" step="0.25" value="1">
        </label>

        <button class="btn primary" type="submit">
            Add Meal
        </button>

    </form>
</div>

<div class="form-card custom-food-card">
    <span>CUSTOM FOOD</span>
    <h2>Food not in the database?</h2>
    <p>Add it once and it will be available for future meals.</p>

    <form method="post" action="{{ url_for('add_food') }}">

        <label>
            Food name
            <input
                name="name"
                type="text"
                placeholder="e.g. Homemade Paneer Roll"
                required
            >
        </label>

        <label>
            Calories (kcal)
            <input
                name="calories"
                type="number"
                min="0"
                step="0.1"
                required
            >
        </label>

        <label>
            Protein (g)
            <input
                name="protein"
                type="number"
                min="0"
                step="0.1"
                required
            >
        </label>

        <label>
            Carbohydrates (g)
            <input
                name="carbs"
                type="number"
                min="0"
                step="0.1"
                required
            >
        </label>

        <label>
            Fat (g)
            <input
                name="fat"
                type="number"
                min="0"
                step="0.1"
                required
            >
        </label>

        <button class="btn primary" type="submit">
            + Save Custom Food
        </button>

    </form>
</div>

{% endblock %}
