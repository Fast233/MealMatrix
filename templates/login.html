{% extends 'base.html' %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-header">
            <span class="auth-label">MEALMATRIX</span>

            <h2>Welcome back</h2>

            <p>
                Sign in to continue tracking your meals and nutrition.
            </p>
        </div>

        <form method="POST">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="submit"
                class="btn primary auth-btn"
            >
                Sign In
            </button>

        </form>

        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Create one
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
